<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIGH TECH PS</title>
    <link rel="stylesheet" href="style.css">
    <!-- ربط ملف الـ Manifest إذا وجد -->
</head>
<body>

    <!-- شاشة التحميل الأولية من 1 إلى 100% -->
    <div id="loader-wrapper">
        <div class="loader-content">
            <h2>HIGH TECH PS</h2>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <span id="progress-text">1%</span>
        </div>
    </div>

    <!-- محتوى الموقع الأساسي -->
    <div id="app-content" style="display: none;">
        <h1>مرحباً بك في مركز صيانة بلاي ستيشن</h1>
        <p>الموقع يعمل الآن بكفاءة بدون إنترنت (Offline Mode)</p>
    </div>

    <script>
        // محاكاة شاشة التحميل من 1 إلى 100% عند الفتح لأول مرة
        let width = 1;
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const loaderWrapper = document.getElementById('loader-wrapper');
        const appContent = document.getElementById('app-content');

        let interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                loaderWrapper.style.opacity = '0';
                setTimeout(() => {
                    loaderWrapper.style.display = 'none';
                    appContent.style.display = 'block';
                }, 500);
            } else {
                width++;
                progressBar.style.width = width + '%';
                progressText.innerText = width + '%';
            }
        }, 20); // سرعة التحميل

        // تسجيل الـ Service Worker لتفعيل الكاش والعمل بدون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => {
                        console.log('Service Worker registered successfully:', reg.scope);
                    })
                    .catch((err) => {
                        console.log('Service Worker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
